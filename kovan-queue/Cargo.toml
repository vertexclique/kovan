[package]
name = "kovan-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance queue primitives and disruptor implementation for Kovan."
keywords = ["concurrency", "queue", "disruptor", "lock-free"]
categories = ["concurrency", "data-structures", "no-std"]
readme.workspace = true
# Shares kovan's test harnesses by path (kovan/tests/support), which a
# published package of this crate does not hold.
exclude = ["tests/thread_exit.rs", "tests/steady_memory.rs", "tests/ownership.rs"]

[features]
# Takes the memory of `SegQueue`'s segments from kovan's magazine cache
# (`kovan/recycle`): see kovan's crate docs.
recycle = ["kovan/recycle"]
# See `kovan`'s `shuttle` feature doc. Cascades so `SegQueue`'s segment
# pointers (`kovan::Atomic<T>`) are shuttle-instrumented; also swaps this
# crate's own `ArrayQueue` head/tail/stamp atomics (see `array_queue.rs`),
# which are self-contained (no kovan dependency) and need their own swap.
shuttle = ["kovan/shuttle", "dep:shuttle"]

[dependencies]
crossbeam-utils = "0.8"
kovan = { workspace = true }
shuttle = { version = "0.9.1", optional = true }

[dev-dependencies]
shuttle = "0.9.1"

# `criterion` (via its default `rayon` feature) does not compile for
# `wasm32-*`: native-only, as in kovan and kovan-channel.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "seg_queue"
harness = false

[[bench]]
name = "array_queue"
harness = false

[[bench]]
name = "disruptor"
harness = false
