[package]
name = "kovan-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-producer multi-consumer channels using Kovan for memory reclamation"
keywords = ["concurrency", "channel", "mpmc", "lock-free", "atomic"]
categories = ["concurrency", "data-structures"]
readme.workspace = true
# Shares kovan's test harnesses by path (kovan/tests/support), which a
# published package of this crate does not hold.
exclude = ["tests/thread_exit.rs", "tests/steady_memory.rs", "tests/ownership.rs", "tests/retained_memory.rs"]

[lib]
name = "kovan_channel"
path = "src/lib.rs"

[lints.rust]

[features]
# Takes the memory of the unbounded channel's nodes, and of its wait lists'
# entries, from kovan's magazine cache (`kovan/recycle`): see kovan's crate
# docs.
recycle = ["kovan/recycle"]
# See `kovan`'s `shuttle` feature doc. Cascades so `Atomic<Node<T>>` (the
# unbounded channel's linked-list message transport, which the bounded
# channel is built on) is shuttle-instrumented; also swaps this crate's own
# `AtomicWaker` state machine (see `signal.rs`), the register-vs-wake race
# these tests target.
shuttle = ["kovan/shuttle", "dep:shuttle"]

[dependencies]
crossbeam-utils = "0.8.21"
kovan = { workspace = true }
shuttle = { version = "0.9.1", optional = true }

[dev-dependencies]
futures = "0.3"

# `criterion` (via its default `rayon` feature) and `shuttle` (via
# `corosensei`, stackful coroutines with no wasm support, and transitively
# via `rand` -> `getrandom` without the wasm "js" feature) both fail to
# compile for `wasm32-*`. Native-only.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
shuttle = "0.9.1"

[[bench]]
name = "bounded_spsc"
harness = false

[[bench]]
name = "bounded_mpmc"
harness = false

[[bench]]
name = "unbounded_mpmc"
harness = false

[[bench]]
name = "async_wake_latency"
harness = false

[[bench]]
name = "channel_api"
harness = false

# Single-threaded, non-blocking-API-only adaptations of the tests/*.rs
# integration tests, kept under tests/wasm/ so they also compile and run on
# `wasm32-*`. Each file is whole-file-gated `#![cfg(target_arch = "wasm32")]`
# (see tests/shuttle_channel.rs for the same pattern with a feature instead
# of a target), so it contributes zero tests to the native suite -- the
# native baseline is unaffected. Cargo's autodiscovery only picks up
# top-level tests/*.rs files, not subdirectories, so each target below is
# registered explicitly. The tests/*.rs originals are untouched and remain
# the real blocking/concurrency coverage on native.
[[test]]
name = "wasm_try_recv"
path = "tests/wasm/try_recv.rs"

[[test]]
name = "wasm_unbounded_send"
path = "tests/wasm/unbounded_send.rs"

[[test]]
name = "wasm_async_send_recv"
path = "tests/wasm/async_send_recv.rs"

[[test]]
name = "wasm_select"
path = "tests/wasm/select.rs"
