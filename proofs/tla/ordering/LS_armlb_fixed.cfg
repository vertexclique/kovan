\* The fixed code on ARMv8 or POWER (ARMLB): the tag stored Release (STLR), the fence
\* publish_fence already had there. The reader's read of A may be satisfied late, but not past a
\* Release store. Three sections, one retire. Must pass.
SPECIFICATION Spec
CONSTANTS
    Model = "ARMLB"
    TagOrder = "Release"
    PinFence = "SeqCstFence"
    ProtectLoad = "Acquire"
    Activation = "Exchange"
    Sections = 3
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
