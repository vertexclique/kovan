\* PASS: the count read after the fence, the claim only Release. It holds because a thread's
\* first pin publishes its epoch and fences (TransitionFence = TRUE): that fence pairs with the
\* scan's. LS_mut_release_claim_no_transition_fence takes the fence away.
SPECIFICATION Spec
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 2
    Path = "Fresh"
    CountRead = "AfterFence"
    ClaimOrder = "Release"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
