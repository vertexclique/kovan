\* PASS: the pin's slow path answered by a helper, as 0.2.5 has it: the pin stores its era, the
\* era's sequence number and the list's sequence number, and fences after all three.
SPECIFICATION Spec
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 1
    Path = "Helped"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Release"
    EscalatedLeave = "Reset"
    HelpedFence = "AfterListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
