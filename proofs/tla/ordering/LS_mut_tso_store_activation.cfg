\* MUTATION: on x86-64, the activation as a plain store (a MOV, no locked instruction)
\* and no fence. The store waits in the reader's buffer while its load of the cell reads A from
\* memory; the writer swaps, fences, reads the list word INVPTR from memory, skips and frees A
\* before the reader reads it. Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "TSO"
    TagOrder = "Relaxed"
    PinFence = "None"
    ProtectLoad = "Acquire"
    Activation = "Store"
    Sections = 1
    Path = "Registered"
    CountRead = "BeforeFence"
    ClaimOrder = "Release"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFree
