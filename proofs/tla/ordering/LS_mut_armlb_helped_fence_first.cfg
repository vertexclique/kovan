\* MUTATION: the fence before the list's sequence number, under ARM's load buffering: the pin's
\* read of A returns freed memory. On x86-64 the locked decrement that follows the store drains
\* the buffer (LS_tso_helped_fence_first passes).
\* Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "ARMLB"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 1
    Path = "Helped"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFree
