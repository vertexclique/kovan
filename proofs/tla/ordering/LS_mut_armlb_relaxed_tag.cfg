\* MUTATION: 0.2.4 on ARMv8 or POWER (ARMLB): publish_fence is a fence there, the tag
\* store a plain STR. The reader's read of A is satisfied after its tag store is visible; the
\* writer sees the tag, skips the slot and frees A first: the read returns freed memory.
\* Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "ARMLB"
    TagOrder = "Relaxed"
    PinFence = "SeqCstFence"
    ProtectLoad = "Acquire"
    Activation = "Exchange"
    Sections = 1
INVARIANTS
    NoUseAfterFree
