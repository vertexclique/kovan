\* MUTATION: the fence before the store of the list's sequence number, as before 0.2.5. The scan
\* reads that number still odd and skips the slot; the store that makes it even comes after the
\* pin's fence, so nothing orders the pin's load after the scan's fence: it loads A, which the
\* writer frees.
\* Expected: NoUseAfterFreeSkipSeqno broken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 1
    Path = "Helped"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFreeSkipSeqno
