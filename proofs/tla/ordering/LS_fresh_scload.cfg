\* PASS: edge 3 as 0.2.5 has it, with the SeqCst protected load. A reader thread claims its ID
\* (a SeqCst compare-exchange), pins for the first time and loads; the scan reads the thread
\* count after its fence. Either the count covers the reader or the reader's load sees the swap.
SPECIFICATION Spec
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 2
    Path = "Fresh"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Release"
    EscalatedLeave = "Reset"
    HelpedFence = "AfterListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
