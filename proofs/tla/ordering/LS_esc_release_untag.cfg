\* PASS: an escalated section, then a pin, as 0.2.5 has it: the activation's store of the era
\* without its tag is Release. A scan that reads the list word as the escalated section left it and
\* the era 0 of the next activation skips the slot, and its Acquire load of that era orders the
\* escalated section's reads before the free.
SPECIFICATION Spec
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 2
    Path = "Escalate"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Release"
    EscalatedLeave = "Reset"
    HelpedFence = "AfterListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
