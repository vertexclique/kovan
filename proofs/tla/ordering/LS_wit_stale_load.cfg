\* WITNESS: under fix F the reader's protected load can still return A after the writer's
\* swap ran (the model is weak, not sequentially consistent). Expected: NoStaleLoad broken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "SeqCstFence"
    ProtectLoad = "Acquire"
    Activation = "Exchange"
    Sections = 1
INVARIANTS
    NoStaleLoad
