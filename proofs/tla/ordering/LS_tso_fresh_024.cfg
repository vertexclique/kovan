\* PASS: 0.2.4's order (the count read before the fence, a Release claim) on x86-64's store
\* buffers: the locked claim and the locked swap keep it from happening on that hardware.
SPECIFICATION Spec
CONSTANTS
    Model = "TSO"
    TagOrder = "Relaxed"
    PinFence = "None"
    ProtectLoad = "Acquire"
    Activation = "Exchange"
    Sections = 2
    Path = "Fresh"
    CountRead = "BeforeFence"
    ClaimOrder = "Release"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
