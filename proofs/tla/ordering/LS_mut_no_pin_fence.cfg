\* MUTATION: edge 2 alone. The tag stored Release (edge 1 fixed), but no fence after the
\* activation and an Acquire protected load: a SeqCst exchange is not a fence, so the reader's
\* load may return A after the writer's fence while the scan reads the slot as left.
\* Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "Acquire"
    Activation = "Exchange"
    Sections = 1
    Path = "Registered"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFree
