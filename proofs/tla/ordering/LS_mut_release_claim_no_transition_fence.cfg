\* MUTATION: the count read after the fence, the claim Release, and no fence in the first pin.
\* A Release claim is not in the SeqCst order, so the scan's count may miss it while the reader's
\* SeqCst load still returns A.
\* Expected: NoUseAfterFreeOutOfRange broken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 1
    Path = "Fresh"
    CountRead = "AfterFence"
    ClaimOrder = "Release"
    TransitionFence = FALSE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFreeOutOfRange
