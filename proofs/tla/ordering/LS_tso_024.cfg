\* 0.2.4 on x86-64 hardware (TSO): the tag stored Relaxed (a MOV), no fence after the
\* activation, whose exchange is a locked XCHG. Three sections, one retire. Must pass.
SPECIFICATION Spec
CONSTANTS
    Model = "TSO"
    TagOrder = "Relaxed"
    PinFence = "None"
    ProtectLoad = "Acquire"
    Activation = "Exchange"
    Sections = 3
    Path = "Registered"
    CountRead = "BeforeFence"
    ClaimOrder = "Release"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
