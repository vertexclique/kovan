\* Fix S under C11: the tag stored Release, no fence after the activation, the protected
\* load SeqCst. Three sections, one retire. Must pass.
SPECIFICATION Spec
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 3
    Path = "Registered"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Release"
    EscalatedLeave = "Reset"
    HelpedFence = "AfterListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
