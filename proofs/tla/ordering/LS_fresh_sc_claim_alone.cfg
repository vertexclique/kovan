\* PASS: the count read after the fence and the claim SeqCst, without the first pin's fence.
\* The SeqCst claim alone pairs with the scan's fence, so 0.2.5 does not rest on that fence.
SPECIFICATION Spec
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 2
    Path = "Fresh"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = FALSE
    UntagOrder = "Release"
    EscalatedLeave = "Reset"
    HelpedFence = "AfterListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
