\* PASS: the fence before the list's sequence number on x86-64's store buffers: the locked
\* decrement after the store (dec_slow) drains the buffer before the pin's loads, so 0.2.4 held on
\* that hardware.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Model = "TSO"
    TagOrder = "Release"
    PinFence = "None"
    ProtectLoad = "SeqCst"
    Activation = "Exchange"
    Sections = 1
    Path = "Helped"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Relaxed"
    EscalatedLeave = "Reset"
    HelpedFence = "BeforeListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
