\* Fix F under C11: the tag stored Release, fence(SeqCst) after the activation on every
\* target. Three sections of the reader, one retire of the writer. Must pass.
SPECIFICATION Spec
CONSTANTS
    Model = "C11"
    TagOrder = "Release"
    PinFence = "SeqCstFence"
    ProtectLoad = "Acquire"
    Activation = "Exchange"
    Sections = 3
    Path = "Registered"
    CountRead = "AfterFence"
    ClaimOrder = "SeqCst"
    TransitionFence = TRUE
    UntagOrder = "Release"
    EscalatedLeave = "Reset"
    HelpedFence = "AfterListSeqno"
INVARIANTS
    NoUseAfterFree
    FreedAtEnd
