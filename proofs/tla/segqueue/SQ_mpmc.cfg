    Pops = 1
    Try = FALSE
    SEG = 1
    MaxSegs = 5
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    UniqueTake
    RealTimeOrder
    PopOrder
    NoLoss
