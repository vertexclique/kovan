\* Two producers pushing two values each, one consumer popping four times; segments of two cells.
\* What it catches: a lost or repeated value, a value written ahead of one whose push returned
\* before its own began, a pop taking a value ahead of one taken before it began, an empty answer
\* while a returned push waits, a use after free of a segment.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Producers = {1, 2}
    Consumers = {3}
    K = 2
    Pops = 2
    Try = FALSE
    SEG = 2
    MaxSegs = 5
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    UniqueTake
    RealTimeOrder
    PopOrder
    NoLoss
    Words
