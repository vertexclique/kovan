\* WITNESS: a recv's re-check finds a message and notifies its own entry. Expected: NoSelfNotifyW broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3}
    NC = 1
    Prog <- P_keep
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "self_notify"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoSelfNotifyW
CHECK_DEADLOCK FALSE
