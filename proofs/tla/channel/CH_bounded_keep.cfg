\* Bounded, capacity one, the sender keeping its handle: both wait lists with no
\* disconnect to rescue a lost wakeup; the last receive waits for good.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_bounded_keep
    Cap = 1
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
CHECK_DEADLOCK FALSE
