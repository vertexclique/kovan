\* MUTATION self_notify_after_take (the code before the fix): the recv notifies its own entry
\* after the take, and a notify_one that popped it in between spends its wakeup there: the other
\* receiver stays parked with a value in the channel. Expected: NoLostWakeup broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3}
    NC = 1
    Prog <- P_kk_r_r
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "none"
    Rdv = FALSE
    Mutation = "self_notify_after_take"
INVARIANTS
    NoLostWakeup
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
CHECK_DEADLOCK FALSE
