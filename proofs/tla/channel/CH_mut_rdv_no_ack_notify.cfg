\* rdv_no_ack_notify: a rendezvous receive wakes no send waiting for its value.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_rdv
    Cap = 1
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = TRUE
    Mutation = "rdv_no_ack_notify"
INVARIANTS
    NoLostWakeup
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
