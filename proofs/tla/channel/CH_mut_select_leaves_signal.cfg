\* MUTATION select_leaves_signal (the code before the fix): the signal stays live in the wait
\* list and absorbs the next send's wakeup: the next select! parks with a value in the channel.
\* Expected: NoLostWakeup broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_kk_selsel
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "none"
    Rdv = FALSE
    Mutation = "select_leaves_signal"
INVARIANTS
    NoLostWakeup
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
CHECK_DEADLOCK FALSE
