\* MUTATION check_then_notify: notify_one asks is_notified, then notifies in a later step: the
\* recv's cancel in between leaves each side sure the other has the wakeup.
\* Expected: NoLostWakeup broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3}
    NC = 1
    Prog <- P_kk_r_r
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "none"
    Rdv = FALSE
    Mutation = "check_then_notify"
INVARIANTS
    NoLostWakeup
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
CHECK_DEADLOCK FALSE
