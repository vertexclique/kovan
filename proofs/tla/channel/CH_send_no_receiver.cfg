\* A bounded send on a full channel whose every receiver is gone drops its value and returns.
\* Expected: pass.
SPECIFICATION FairSpec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_ss_t
    Cap = 1
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
PROPERTIES
    Termination
CHECK_DEADLOCK FALSE
