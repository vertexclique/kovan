\* Blocking and deadline receives, every thread scheduled fairly: every operation
\* ends.
SPECIFICATION FairSpec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3}
    NC = 1
    Prog <- P_live_recv
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
PROPERTIES
    Termination
