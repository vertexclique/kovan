\* MUTATION retry_stale_tail: a send whose link compare-and-swap failed retries it on the same tail, forever.
\* Expected: Termination broken.
SPECIFICATION FairSpec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3}
    NC = 1
    Prog <- P_s_s
    Cap = 0
    Stepped = TRUE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = FALSE
    Mutation = "retry_stale_tail"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
PROPERTIES
    Termination
