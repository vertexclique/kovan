\* Sends once the only receiver is gone: each drops its value; the last receiver drained the
\* channel, and at most a send already past its check links one.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_send_gone
    Cap = 0
    Stepped = TRUE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 4
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
