\* MUTATION select_never_disconnects (the code before the fix had no check that every channel is
\* disconnected): select! over channels all disconnected and empty never takes an arm; here, with
\* the rest of the fix in place, it registers on none and goes round for good (the code before the
\* fix registered on them and parked for good). Expected: NoBound broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_d_sel
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = FALSE
    Mutation = "select_never_disconnects"
INVARIANTS
    NoBound
    NoLostWakeup
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
CHECK_DEADLOCK FALSE
