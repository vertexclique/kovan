\* Bounded, capacity one, blocking and async sends and receives, every thread
\* scheduled fairly: every operation ends.
SPECIFICATION FairSpec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_live_bounded
    Cap = 1
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
PROPERTIES
    Termination
