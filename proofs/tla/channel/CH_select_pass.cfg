\* select! woken by one channel taking another arm: the wakeup passed on. A receiver whose value
\* the select took waits for good, so deadlock is not checked (NoLostWakeup says what may wait).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3, 4}
    NC = 2
    Prog <- P_select_pass
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
