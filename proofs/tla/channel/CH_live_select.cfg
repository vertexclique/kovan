\* select! over two channels, every thread scheduled fairly: the select ends.
SPECIFICATION FairSpec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3}
    NC = 2
    Prog <- P_live_select
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
PROPERTIES
    Termination
