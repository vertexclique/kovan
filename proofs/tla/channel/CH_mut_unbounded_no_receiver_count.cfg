\* unbounded_no_receiver_count: sends once every receiver is gone queue their values for no one.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_send_gone
    Cap = 0
    Stepped = TRUE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 4
    Watch = "none"
    Rdv = FALSE
    Mutation = "unbounded_no_receiver_count"
INVARIANTS
    NoneKeptForNoReceiver
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
