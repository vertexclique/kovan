\* MUTATION select_waits_unregistered (the fix as first written, found by this model): every
\* channel disconnects between select!'s check that every one is and its registration, which
\* then registers on none, and select! waits for good. Expected: NoLostWakeup broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_d_sel
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = FALSE
    Mutation = "select_waits_unregistered"
INVARIANTS
    NoLostWakeup
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
CHECK_DEADLOCK FALSE
