\* WITNESS: a bounded send finds every receiver gone and drops its value. Expected: NoRxGoneW broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_ss_t
    Cap = 1
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "rx_gone"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoRxGoneW
CHECK_DEADLOCK FALSE
