\* WITNESS: AtomicWaker::register finds a wake in flight and wakes the waker directly. Expected: NoWakeByRefW broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_async
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "wake_by_ref"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoWakeByRefW
