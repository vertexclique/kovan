\* The unbounded list at its atomic steps: two senders racing their links and their
\* tail moves, two receivers racing their takes and helping a lagging tail; the values
\* left when the channel is dropped go with their nodes.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3, 4}
    NC = 1
    Prog <- P_list
    Cap = 0
    Stepped = TRUE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 6
    Watch = "none"
    Rdv = FALSE
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
    OneEntryPerWaiter
    NoneKeptForNoReceiver
    RdvSound
