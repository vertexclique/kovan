\* MUTATION cap_off_by_one: the bounded send sees the channel full only past its capacity.
\* Expected: Capacity broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    NC = 1
    Prog <- P_bounded
    Cap = 1
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 8
    Watch = "none"
    Rdv = FALSE
    Mutation = "cap_off_by_one"
INVARIANTS
    Capacity
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    RecvNoneSound
    NoLostWakeup
    RegisterFresh
    WakerExclusive
    WakeNotLost
    SelectOnce
    NoBound
