\* abandon_keeps_entry: a timed-out wait leaves its entry in its slot. With one waiter its next
\* registration always takes its own stale slot over; with two, a slot freed ahead of it is taken.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    defaultInitValue = defaultInitValue
    Waiters = {1, 2}
    Notifiers = {10}
    Discs = {}
    K = 2
    Wants = 2
    Sends = 1
    Rounds = 3
    Deadline = TRUE
    Mutation = "abandon_keeps_entry"
INVARIANTS
    NoLostWakeup
    OneEntryPerWaiter
    CountCovers
    Fits
    NoBound
