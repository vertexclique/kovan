\* MUTATION exit_loop: an exit repeats its rounds until no batch is left, as long as the drops it runs keep retiring. Expected: LoopBounds broken.
\* RetireFreq 2: a retire inside a drop stays in the batch, so the chain reaches a third round; with
\* RetireFreq 1 each such retire submits and frees its node at once and the exit needs two.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 5
    Prog <- P_exit_chain1
    Dtor <- DtorChain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "exit_loop"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    LoopBounds
