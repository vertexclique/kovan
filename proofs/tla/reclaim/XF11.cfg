\* A thread that never pinned flushes twice while another exits with a batch it cannot place (parked on its tid): a flush after the park claims a tid and adopts it.
\* What it catches: thread 1 exits while thread 2 holds a reservation, so its one-value batch is
\* parked; thread 3, with no tid, flushes twice at any moment and exits. TLC tries every
\* interleaving of the three threads and checks the invariants listed below on each, with the
\* step counts on: no value freed while a guard holds it or freed twice, no batch lost once all
\* have exited (NoLoss), every loop and every operation within its bound (LoopBounds, WaitFree),
\* the flush that claims a tid to adopt included. A change to that new path that broke one of
\* these invariants in this scenario would fail here.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_flush_orphan_one
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
    WaitFree
