\* MUTATION quiesce_keeps_batch: a quiesce whose batch cannot be placed merges it back into its own batch, as a flush does.
\* Expected: RetiredFreed broken (the idle quiescer holds the value it retired, whatever the other threads do).
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_quiesce_small
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "quiesce_keeps_batch"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
