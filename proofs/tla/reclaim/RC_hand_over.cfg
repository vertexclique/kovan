\* A slow-path hand-over racing a retire into the pending thread's slot. Every safety invariant.
\* Steps are not counted here: counted, the scenario ran past an hour on four workers (31.6M
\* distinct states at 34 minutes, still growing), so this configuration does not check WaitFree;
\* the RC_wf_* configurations bound the steps of each operation, the slow path's included.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 4
    Prog <- P_hand_over
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 1
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
