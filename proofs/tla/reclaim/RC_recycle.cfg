\* Recycling, the basic case (P_recycle): thread 1 reads cell 1 and holds what it read; thread 2
\* replaces cell 1 again and again and flushes in between, so its retired nodes are freed into the
\* pool and taken back by its later writes, each with RetiredNode::new() written over its header,
\* as reclaim.rs asks. It checks every safety invariant, in every interleaving TLC reaches within
\* these bounds. The one recycling adds: a pointer a guard holds keeps naming the same object (its
\* node is not in the pool and has the incarnation it was loaded with) until the guard drops, and
\* kovan never reads or writes a node that is in the pool or in use again. It would catch kovan
\* calling dealloc while a reader could still reach the node (the reader would then see another
\* object at the same address), or kovan touching a node after its dealloc. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
