\* MUTATION leave_untagged: the leave does not tag the era word, so the second insert links to the first's node and the left slot keeps the two, read as active, while the reader holds no guard. Expected: ActiveOnlyPinned violated.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 6
    Prog <- P_leave_race2
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "leave_untagged"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    CountExact
    ActiveOnlyPinned
    LeftSlotsEmpty
