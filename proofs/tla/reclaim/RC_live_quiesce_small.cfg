\* Weak fairness; a thread quiesces with a batch smaller than the active slots (two threads hold reservations) and idles for good:
\* its value is eventually freed, once the others quiesce. What it catches: a quiesce that keeps an unplaceable batch in its own
\* handle (RC_mut_quiesce_keeps_batch shows RetiredFreed fails then); the quiesce parks it on its tid for another thread's quiesce to adopt.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_quiesce_small
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
