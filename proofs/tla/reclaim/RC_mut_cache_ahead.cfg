\* MUTATION cache_ahead: a raise caches the epoch it read and never stores it in the thread's slot. Expected: CacheBelowPublished broken.
\* What it catches: a thread trusting a reservation no other thread can see. The reader of
\* P_two_loads raises its reservation while the writer advances the epoch; with the store left
\* out, its cached epoch runs ahead of the slot every other thread reads. The other safety
\* properties are checked beside it and hold until then.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 5
    Prog <- P_two_loads
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "cache_ahead"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    CacheBelowPublished
    NoUseAfterFree
    NoDoubleFree
    ListsHoldNoFreed
    WellFormed
