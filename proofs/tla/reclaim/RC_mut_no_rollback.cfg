\* MUTATION no_rollback: an insert that finds INVPTR behind its exchange leaves its node in the word and counts it, so a left slot reads as active. Expected: ActiveOnlyPinned broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 10
    Prog <- P_leave_race
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "no_rollback"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    ActiveOnlyPinned
