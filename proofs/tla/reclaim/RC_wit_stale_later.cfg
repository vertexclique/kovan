\* WITNESS: a recycled node is about to go out with a birth epoch later than the one
\* RetiredNode::new() would stamp on the recycling thread. Shows RC_recycle_stale_lag reaches the
\* case it is for (same scenario and variant). Expected: NoStaleLaterW broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 5
    Prog <- P_recycle_lag
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "stale_reuse"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoStaleLaterW
