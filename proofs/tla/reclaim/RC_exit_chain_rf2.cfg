\* The exit_loop mutation's scenario (RetireFreq 2) with the code as it is: the exit's rounds stay
\* within ExitRounds and the rest is parked.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 5
    Prog <- P_exit_chain1
    Dtor <- DtorChain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
