\* RC_recycle_dtor_read with stale_reuse: the node a drop takes back from the walk that freed it
\* keeps the header it had in the batch being freed. Every safety invariant but BirthFresh.
\* Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 12
    Prog <- P_recycle_dtor_read
    Dtor <- DtorRW2Recycle
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "stale_reuse"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    NoBatchOnLeftSlot
    PinnedIsActive
    IdleHoldsNothing
    CacheBelowPublished
    DetachNotStarved
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
