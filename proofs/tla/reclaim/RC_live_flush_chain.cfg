\* Weak fairness; a flush whose destructors retire again: every retired node is eventually freed.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 6
    Prog <- P_flush_chain
    Dtor <- DtorRtRtPU
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
