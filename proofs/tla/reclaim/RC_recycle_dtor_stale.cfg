\* The same claim on the drop scenario of RC_recycle_dtor (stale_reuse): the node a drop takes back
\* from the walk that freed it keeps the header it had in that batch, its words still describing
\* the batch being freed. Every safety invariant but BirthFresh. It would catch kovan, or the walk
\* still running, reading those stale words as if they were the node's new state. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 6
    Prog <- P_recycle_dtor
    Dtor <- DtorRW2Recycle
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "stale_reuse"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    FlushReleases
    LoopBounds
    NoLoss
