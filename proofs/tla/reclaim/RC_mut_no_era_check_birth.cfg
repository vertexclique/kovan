\* MUTATION no_era_check, the programs of RC_era, checked against the era rule alone: a load that does not compare the epoch leaves a node born after the reservation unprotected. Expected: EraCoversBirth broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 7
    Prog <- P_era
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "no_era_check"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    EraCoversBirth
    BirthBelowEpoch
