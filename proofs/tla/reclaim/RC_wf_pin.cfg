\* Step counts: pins with one fast attempt against a thread that helps and advances the epoch at every retire.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 9
    Prog <- P_wf_pin
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 1
    MaxEpoch = 8
    Mutation = "none"
    CountSteps = TRUE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    WaitFree
    NoUseAfterFree
