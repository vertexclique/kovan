\* Step counts: pins against a thread that flushes again and again (the pin is one exchange whatever the flushes do).
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 9
    Prog <- P_wf_pin
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 8
    Mutation = "none"
    CountSteps = TRUE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    WaitFree
    NoUseAfterFree
