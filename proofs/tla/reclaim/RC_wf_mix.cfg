\* Step counts of every operation in a mix of pins, loads, writes and flushes.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 11
    Prog <- P_mix
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = TRUE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    WaitFree
