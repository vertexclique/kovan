\* MUTATION flush_needs_tid: flush does nothing on a thread with no tid, so a thread that never pinned never adopts what an exit parked. Expected: OrphansAdopted broken.
\* What it catches: the defect this mutation puts back, the flush of kovan 0.1.22, which returned
\* at once on a thread with no tid. Same scenario as RC_live_orphan; in the counterexample TLC
\* finds, thread 1 parks its batch, thread 3's only flush returns without adopting, every thread
\* ends and the batch stays parked forever, which breaks OrphansAdopted. NoLoss cannot catch this: once every thread has exited
\* it counts a parked batch as kept, not lost.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_flush_orphan_live
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "flush_needs_tid"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    OrphansAdopted
