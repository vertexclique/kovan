\* A destructor run by a flush reads a cell while another thread replaces and retires its value twice: the destructor's pin enters the slot for its own section.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 12
    Prog <- P_flush_dtor_load
    Dtor <- DtorR2
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    NoBatchOnLeftSlot
    PinnedIsActive
    IdleHoldsNothing
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
