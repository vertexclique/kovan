\* Two threads that never pin each retire one value (P_unpinned_claims); one flushes and exits,
\* the other exits. Each submission claims a tid, so the two race for tids, and NoLoss checks that
\* every value is freed or parked once both exited. A third thread holding a reservation meanwhile
\* is checked beside each claimer by RC_wf_unpinned_flush and RC_wf_unpinned_exit; all three at
\* once (the scenario before the split) ran past an hour. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_unpinned_claims
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
