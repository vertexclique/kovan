\* MUTATION exit_no_adopt: the exit of kovan 0.2.0, which never adopted: with no flush, the batch thread 1 parked stays parked and thread 3's exit parks one more. Expected: OrphansBounded broken.
\* thread 1 parked stays parked forever. Expected: OrphansAdopted broken.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 3
    Prog <- P_exit_adopt
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "exit_no_adopt"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    OrphansBounded
