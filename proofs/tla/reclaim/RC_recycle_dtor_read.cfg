\* Recycling inside the walk that frees, reader's side (P_recycle_dtor_read): as
\* RC_recycle_dtor_write, while thread 2 holds cell 2's value under a guard. Every safety
\* invariant. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 6
    Prog <- P_recycle_dtor_read
    Dtor <- DtorRW2Recycle
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
