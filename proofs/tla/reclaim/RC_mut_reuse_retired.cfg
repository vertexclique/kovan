\* MUTATION reuse_retired: the recycler may take a node that is still retired (its batch not freed,
\* its dealloc not called), as a structure would if it reused a node as soon as it unlinked it.
\* Scenario as RC_recycle. The model must notice that a reader's pointer now names another object:
\* a model that could not see a reuse under a reader would pass here. Expected: NoUseAfterFree
\* broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "reuse_retired"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
