\* Weak fairness for every thread; a thread that never pinned flushes after another exited with a batch it could not place: every parked batch is eventually adopted.
\* What it catches: a parked batch that no flush ever takes. Thread 1 exits while thread 2 holds
\* a reservation, so its one-value batch is parked; thread 3, with no tid, waits for thread 1 to
\* end and flushes once. With every thread scheduled fairly (none stops for good), TLC checks
\* OrphansAdopted on every schedule: eventually no tid holds a parked chain. It passes because
\* thread 3's flush claims a tid and adopts; RC_mut_flush_needs_tid shows it fails without that.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_flush_orphan_live
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    OrphansAdopted
