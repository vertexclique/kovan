\* The same claim on a recycler whose cached epoch lags (P_recycle_lag, stale_reuse): thread 1,
\* pinned at the first epoch, can take back a node thread 2 stamped with a later epoch, and publish
\* it with that later epoch, later than its own RetiredNode::new() would stamp. Every safety
\* invariant but BirthFresh. It would catch a kept birth epoch later than the epoch the node is
\* published at, which would let its batch skip a reader's slot. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 5
    Prog <- P_recycle_lag
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "stale_reuse"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    FlushReleases
    LoopBounds
    NoLoss
