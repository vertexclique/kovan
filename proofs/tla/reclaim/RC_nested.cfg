\* Nested guards: the inner drop leaves the slot active and the outer section's value protected while a writer replaces and retires it; the outer drop frees it.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 8
    Prog <- P_nested
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    WellFormed
    ActiveOnlyPinned
    CacheBelowPublished
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    NoLoss
