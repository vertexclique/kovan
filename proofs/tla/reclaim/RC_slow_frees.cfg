\* A slow path with batches placed in its slot while it is pending; the drop of a batch it takes reads a cell, replaces it and retires what it read, after the republication. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 9
    Prog <- P_slow_frees
    Dtor <- DtorRW2
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 1
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    NoBatchOnLeftSlot
    PinnedIsActive
    IdleHoldsNothing
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
