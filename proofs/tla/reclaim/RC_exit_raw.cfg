\* A drop an exit runs reads a value born after the exiting thread's last publication, which another thread retires.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 15
    Prog <- P_exit_raw
    Dtor <- DtorR2
    RetireFreq = 3
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    WellFormed
    ActiveOnlyPinned
    CacheBelowPublished
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    NoLoss
