\* An exit adopts the batch an earlier exit parked, with no flush anywhere: once the exits are over at most one batch stays parked (OrphansBounded).
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 3
    Prog <- P_exit_adopt
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    OrphansBounded
