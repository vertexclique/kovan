    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 1
    MaxEpoch = 8
    Mutation = "none"
    CountSteps = TRUE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
