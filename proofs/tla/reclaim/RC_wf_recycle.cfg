\* Step counts with recycling, the basic case (P_wf_recycle, a cut-down P_recycle): thread 1 reads
\* cell 1 in two guards while thread 2 replaces cell 1 three times and flushes between, so later
\* writes take back nodes earlier ones retired. Every node recycles, and every operation's steps
\* are counted. It checks LoopBounds (every loop within the bound its code states) and WaitFree
\* (every operation within its step bound, the bound counting each node object: each reuse of an id
\* is one more object). It would catch a recycling path that makes an operation of kovan loop or
\* wait beyond those bounds. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_wf_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    CountSteps = TRUE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    LoopBounds
    WaitFree
