\* Step counts: a thread that never pinned retires one value, flushes and exits while another pins and unpins.
\* What it catches: an unpinned retire, its flush or its exit breaking a property or its step
\* bound. Thread 1's retire claims a tid for its epoch advance (a thread's first retire advances),
\* so its flush finds the tid and submits its batch of one. Thread 2 pins, unpins and exits. TLC
\* tries every interleaving and checks the invariants below on each, with the step counts on:
\* NoLoss and WaitFree among them.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 2
    Prog <- P_wf_unpinned_flush
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
    WaitFree
