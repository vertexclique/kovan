\* Weak fairness; one thread retires a value without pinning, flushes, then keeps pinning and unpinning without exiting: the value is eventually freed.
\* What it catches: a flush that leaves the values of a thread with no tid in its batch. The
\* thread never exits, so its exit cannot submit them: only its flush can. With the thread
\* scheduled fairly, TLC checks RetiredFreed on every schedule: eventually no node is "retired"
\* (every retired value was freed). It passes because the flush claims a tid and submits;
\* RC_mut_flush_skips_batch shows it fails without that.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 2
    Prog <- P_unpinned_flush_live
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
