\* A drop run by the full-cache free of a help re-enters the help, and its traversal frees only what the cell still holds once. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 9
    Prog <- P_reenter_help
    Dtor <- DtorRt5
    RetireFreq = 3
    EpochFreq = 1
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 1
    MaxEpoch = 12
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    NoBatchOnLeftSlot
    PinnedIsActive
    IdleHoldsNothing
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
