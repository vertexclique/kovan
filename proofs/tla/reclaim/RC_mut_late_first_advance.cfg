\* MUTATION late_first_advance: the retire count of kovan 0.2.0, raised before its check: no retire moves the epoch, the last node goes to the slot of the reader that stays pinned, and the exit's advance after it comes too late. Expected: LastReleased broken.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 3
    Prog <- P_first_advance
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 3
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "late_first_advance"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    LastReleased
