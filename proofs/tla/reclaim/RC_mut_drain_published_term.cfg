\* MUTATION drain_published, every thread scheduled fairly, checked against Termination. Expected: Termination broken.
\* What it catches: an operation that never ends. Under this rule a drain waits on a published
\* reservation that is never withdrawn, so the threads never all finish although each is
\* scheduled fairly. The safety properties are checked beside it and hold throughout.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 3
    Prog <- P_drain_live
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "drain_published"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
INVARIANTS
    NoUseAfterFree
    NoDoubleFree
    ListsHoldNoFreed
    WellFormed
    CacheBelowPublished
PROPERTY
    Termination
