\* WITNESS: an exit on a thread with no tid claims one. Expected: NoExitClaimW broken.
\* What it catches: nothing in the code. It asserts that no exit ever claims a tid, on the
\* scenario of RC_wf_unpinned_exit. TLC breaking it shows that the scenario reaches the exit's
\* branch for a batch and no tid (a retire after the exit), so the pass of RC_wf_unpinned_exit
\* covers that branch instead of passing because it never ran.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_wf_unpinned_exit
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoExitClaimW
