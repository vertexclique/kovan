\* MUTATION quiesce_keeps_reservation: a quiesce drains its list but never publishes epoch 0, keeping the reservation.
\* Expected: RetiredFreed broken (the idle thread's slot still takes the batch retired afterwards).
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_quiesce_live
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "quiesce_keeps_reservation"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
