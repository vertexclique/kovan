\* A writer loading unprotected under its own exclusion, a reader loading protected.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 9
    Prog <- P_lu
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    WellFormed
    ActiveOnlyPinned
    CacheBelowPublished
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    NoLoss
