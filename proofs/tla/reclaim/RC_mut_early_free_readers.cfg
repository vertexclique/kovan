\* MUTATION early_free on the writer-and-two-readers shape: the flush places the batch in both readers' slots (count 2), and one reader's drop takes the count to zero with its traversal and frees the old value in its drain while the other reader still holds it. Expected: NoUseAfterFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 4
    Prog <- P_swap_readers
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "early_free"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CHECK_DEADLOCK FALSE
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
