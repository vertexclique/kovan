\* MUTATION pool_lock_held: the recycler's pool has a lock, and a write keeps it from taking a node
\* until its retire of the old value returns (P_pool_lock, one thread). That retire frees the old
\* value's batch at once and calls its dealloc on the same thread, and dealloc waits for the same
\* lock: the thread waits for itself. Shows why reclaim.rs forbids holding the pool's lock across a
\* call into kovan. Expected: deadlock.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 3
    Prog <- P_pool_lock
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "pool_lock_held"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
