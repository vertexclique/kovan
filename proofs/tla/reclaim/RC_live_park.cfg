\* Weak fairness; a reader parks after one section, a writer retires, flushes and exits: every retired node is eventually released, no thread pinning or flushing again.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 8
    Prog <- P_park
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
PROPERTIES
    DrainLive
