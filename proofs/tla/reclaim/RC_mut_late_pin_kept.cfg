\* MUTATION (a program): a section after the exit that never ends, so no exit submits the value it
\* retired. Weak fairness for every thread; thread 2 waits until thread 1 has ended and flushes.
\* Expected: RetiredFreed broken (the value stays in that section's batch, never submitted, on a
\* fair schedule).
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_late_pin_kept
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
