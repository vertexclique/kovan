\* MUTATION no_insert_recheck: an insert does not read the era word after its exchange, so two inserts racing a leave leave a list in the left slot. Expected: NoBatchOnLeftSlot broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 12
    Prog <- P_tag_race
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "no_insert_recheck"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoBatchOnLeftSlot
