\* MUTATION cache_copied: a full cache is freed from a copy while its cell still holds it, so a traversal re-entered from a drop frees it again. Expected: NoDoubleFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 9
    Prog <- P_reenter_help
    Dtor <- DtorRt5
    RetireFreq = 3
    EpochFreq = 1
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 1
    MaxEpoch = 12
    Mutation = "cache_copied"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoDoubleFree
