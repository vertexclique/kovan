\* WITNESS: in RC_wf_recycle_dtor's exact setting, step counts included, a drop run inside a
\* reclamation walk takes a node from the pool. Shows RC_wf_recycle_dtor really counts steps
\* through reuse inside a walk. Expected: NoDtorReuseW broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 6
    Prog <- P_wf_recycle_dtor
    Dtor <- DtorRW2Recycle
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    CountSteps = TRUE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoDtorReuseW
