\* Weak fairness; a thread quiesces and idles for good, another retires two values afterwards: they are freed.
\* What it catches: a quiesce that leaves the reservation published. The idle thread never pins again and never
\* exits, so only the quiesce can make its slot ineligible. TLC checks RetiredFreed (eventually no node is
\* "retired") on every fair schedule; RC_mut_quiesce_keeps_reservation shows it fails without the release,
\* RC_wit_unpin_holds that a thread that only unpins holds the batch.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_quiesce_live
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
