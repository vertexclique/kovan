\* A drop an exit runs pins under the tid the exit released last; a third thread takes the tid over after the release, loads a node, and a batch holding it is placed in its slot: the drop's pin finds that slot belonging to its own exit. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 2
    NCells = 3
    MaxNodes = 11
    Prog <- P_exit_tid_steal
    Dtor <- DtorR3
    RetireFreq = 3
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    NoBatchOnLeftSlot
    PinnedIsActive
    IdleHoldsNothing
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
