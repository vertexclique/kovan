\* MUTATION help_hands_pointer: a helper writes a pointer into the result word instead of 0. Expected: WellFormed broken.
\* What it catches: a hand-over of a pointer through the result word, which kovan never makes
\* (a helper only ever hands over an epoch). The helpee's read of the result records "handoff".
\* The other safety properties are checked beside it and hold until then.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 7
    Prog <- P_help_torn
    Dtor <- Plain
    RetireFreq = 5
    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 1
    MaxEpoch = 8
    Mutation = "help_hands_pointer"
    CountSteps = TRUE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    WellFormed
    NoUseAfterFree
    NoDoubleFree
    ListsHoldNoFreed
    CacheBelowPublished
