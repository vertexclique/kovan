\* Weak fairness; three threads, one parked after its section, two exiting with batches: every retired node is eventually released with no flush anywhere.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 8
    Prog <- P_exits_park
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
PROPERTIES
    DrainLive
