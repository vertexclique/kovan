\* Weak fairness; the programs of RC_swap_readers_turn end and park: every retired node is eventually released, by the readers' drops and the flush, with no thread pinning or flushing again.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 4
    Prog <- P_swap_readers_turn
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
PROPERTIES
    DrainLive
