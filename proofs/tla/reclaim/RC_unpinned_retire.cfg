\* Threads that never pin retire one value each, then one flushes and exits, the other just exits, while a third thread holds a reservation: each claims a tid and submits.
\* What it catches: a batch that a thread with no tid leaves behind, and any harm the claim
\* does. Thread 1 retires a value without pinning, flushes and exits; thread 2 retires one and
\* exits; thread 3 pins, unpins and exits. A one-value batch waits in its thread's batch (a
\* batch of two submits), so the flush of thread 1 and the exit of thread 2 must each claim a
\* tid and submit it. TLC tries every interleaving and checks the invariants listed below on
\* each: in particular NoLoss, that once every thread has exited every retired value is freed
\* or parked on a tid. Steps are not counted here (with counts the scenario reached 19,998,315
\* distinct states, still growing, when a 600-second limit stopped TLC), so this configuration
\* does not check WaitFree.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 3
    Prog <- P_unpinned
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
