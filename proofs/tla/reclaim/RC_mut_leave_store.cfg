\* MUTATION leave_store: the leave stores INVPTR instead of exchanging, so a node an insert exchanged in meanwhile is lost and its batch's count never reaches zero. Expected: NoLoss broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 10
    Prog <- P_leave_race
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "leave_store"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoLoss
    CountExact
