\* The same claim with an intrusive pool (stale_reuse_link_next): no RetiredNode::new(), and
\* dealloc writes the pool's own link into the node's first header word (next), which the reuse
\* keeps. Scenario as RC_recycle. Every safety invariant but BirthFresh. It would catch kovan
\* reading next before rewriting it. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "stale_reuse_link_next"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    FlushReleases
    LoopBounds
    NoLoss
