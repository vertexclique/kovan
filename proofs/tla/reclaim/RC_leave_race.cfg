\* The leave against an insert: a thread pins and drops three times while another retires into its slot and flushes between; an insert may find INVPTR behind its exchange (the rollback) or have its node taken by the next enter.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 10
    Prog <- P_leave_race
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    WellFormed
    ActiveOnlyPinned
    CacheBelowPublished
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    NoLoss
