\* MUTATION (a program): the pin after the exit as the code made it before, a guard that reserved
\* nothing, so thread 1's load is a raw one held with no reservation. Expected: NoUseAfterFree
\* broken (thread 2 retires the value thread 1 holds and its flush frees it).
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_late_pin_unreserved
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
