\* A quiesce on a thread that never pinned while another thread's exit parks a batch it cannot place.
\* What it catches: a quiesce that does not adopt the parked batch (NoLoss, OrphansAdopted's safety side), a claim
\* of a tid that is never released.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_quiesce_exit
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
