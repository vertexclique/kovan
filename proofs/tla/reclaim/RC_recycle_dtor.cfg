\* Recycling inside the walk that frees (P_recycle_dtor): node 1 and a fresh node can be freed in
\* one batch, the fresh one first, and node 1's own drop, run inside that walk, reads cell 2 and
\* replaces it, possibly with the node the same walk freed a step before; thread 2 replaces and
\* reads cell 2 meanwhile. It checks every safety invariant. It would catch kovan's walk reading or
\* writing a node after handing it to the pool (the next drop may already have reused it), a reuse
\* inside a drop corrupting the batch being freed, or a reader's pointer changing object under its
\* guard. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 6
    Prog <- P_recycle_dtor
    Dtor <- DtorRW2Recycle
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
