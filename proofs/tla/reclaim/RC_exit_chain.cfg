\* An exit whose drops retire in a chain: two rounds, the rest parked.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 5
    Prog <- P_exit_chain1
    Dtor <- DtorChain
    RetireFreq = 1
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    NoBatchOnLeftSlot
    PinnedIsActive
    IdleHoldsNothing
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
