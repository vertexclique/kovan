\* A reader pins, loads, drops its guard and parks for good; a writer replaces and retires the value twice, flushing after each, and exits: the reader's drop alone traverses its slot, and what is retired after it skips the left slot.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 8
    Prog <- P_park
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    WellFormed
    ActiveOnlyPinned
    CacheBelowPublished
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    NoLoss
