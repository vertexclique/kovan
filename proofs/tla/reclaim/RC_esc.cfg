\* Loads that escalate (one attempt) while every retire advances the epoch; the escalated drop transitions.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 9
    Prog <- P_esc
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 1
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
