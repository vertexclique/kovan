\* WITNESS: a section holds a node in its second or a later incarnation. Shows the recycling
\* configurations really reuse nodes while readers load them (scenario as RC_recycle): if TLC found
\* no such state, RC_recycle would check nothing about reuse. Expected: NoHeldReusedW broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoHeldReusedW
