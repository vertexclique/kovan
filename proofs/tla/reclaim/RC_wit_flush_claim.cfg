\* WITNESS: a flush on a thread with no tid claims one. Expected: NoFlushClaimW broken.
\* What it catches: nothing in the code. It asserts that no flush ever claims a tid, on the
\* scenario of RC_flush_orphan. TLC breaking it shows that the scenario reaches the new branch
\* of flush (no tid, a batch parked: claim a tid, then adopt), so RC_flush_orphan's pass covers
\* that branch instead of passing because it never ran.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_flush_orphan
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoFlushClaimW
