\* MUTATION pin_skips_activation on the writer-and-two-readers shape: the readers' fast-path pins activate nothing, so the flush's scan finds no reader slot active and the flush frees the old value while reader 3 holds it. Expected: NoUseAfterFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 2
    Prog <- P_swap_readers
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "pin_skips_activation"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CHECK_DEADLOCK FALSE
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
