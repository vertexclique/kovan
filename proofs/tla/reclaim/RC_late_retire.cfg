\* A thread retires a value after its exit, through a handle of its own whose exit submits it.
\* What it catches: thread 1 exits, then retires one value (a thread-local destructor that runs
\* after its handle's) and exits again, the exit of the handle the retire made; thread 2 pins,
\* loads and exits at any moment. With a batch of two and an epoch advance every fourth retire,
\* the late value waits in that handle's batch with no tid until its exit claims one and submits it
\* or parks it. TLC checks the invariants
\* below on every interleaving, the step counts on: no value freed while a guard holds it or
\* freed twice, no value lost once all have exited (NoLoss), every loop and operation within its
\* bound.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_late_retire
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
    WaitFree
