\* Step counts with reuse inside a walk (P_wf_recycle_dtor, a cut-down P_recycle_dtor): node 1's
\* drop, run inside the walk that frees its batch, reads and replaces cell 2 and can take back the
\* node the same walk freed a step before. Every operation's steps are counted, the drop's own
\* operations each on their own. It checks LoopBounds and WaitFree, and would catch a walk, or an
\* operation a drop runs, that takes more steps than its bound when nodes are reused under it.
\* Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 6
    Prog <- P_wf_recycle_dtor
    Dtor <- DtorRW2Recycle
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    CountSteps = TRUE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    LoopBounds
    WaitFree
