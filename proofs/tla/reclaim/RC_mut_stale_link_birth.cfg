\* MUTATION stale_reuse_link_birth: no RetiredNode::new(), and dealloc writes the pool's link (a
\* pointer, above every epoch) over the birth_epoch word, which reclaim.rs allows (dealloc owns the
\* whole allocation, the header included). The node goes out with that pointer for a birth epoch;
\* its next retire finds no slot that publishes an epoch that high (only an escalated reservation
\* would) and frees it at once, under a reader. Scenario as RC_recycle. Shows where the claim that the write is not needed for memory
\* safety stops holding. Expected: NoUseAfterFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "stale_reuse_link_birth"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
