\* Weak fairness for every thread; a value retired in a section after its thread's exit is
\* eventually freed. What it catches: a section after the exit that never leaves. Thread 1 exits,
\* pins, replaces cell 1's value and unpins, then exits again; thread 2 waits until thread 1 has
\* ended and flushes. TLC checks RetiredFreed on every fair schedule.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_late_pin_live
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
