\* Step counting across the leave against an insert: no operation of either thread takes more steps than its bound. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 10
    Prog <- P_leave_race
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    LoadAttempts = 3
    MaxEpoch = 8
    Mutation = "none"
    CountSteps = TRUE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    WaitFree
    NoUseAfterFree
