\* The first retire advances the epoch: a node born after a reader that stays pinned skips its slot and is freed (LastReleased).
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 7
    Prog <- P_first_advance
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 3
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    LastReleased
