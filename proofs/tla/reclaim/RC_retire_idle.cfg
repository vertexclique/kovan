\* A retire that places a batch advances the epoch: a reader that never retires or flushes traverses the batch at its next pin (DrainLive).
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 6
    Prog <- P_retire_idle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 3
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    DrainLive
