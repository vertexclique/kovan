\* MUTATION no_leave (kovan 0.2.3): the outermost drop does not leave the slot, so a parked reader's slot stays eligible and the batches placed in it wait for good. Expected: DrainLive broken.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 8
    Prog <- P_park
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "no_leave"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
PROPERTIES
    DrainLive
