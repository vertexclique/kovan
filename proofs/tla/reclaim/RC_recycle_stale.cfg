\* Checks the claim in reclaim.rs that memory safety does not depend on writing RetiredNode::new()
\* over a recycled node: here the recycler skips that write (stale_reuse), so a node goes out again
\* with the header and birth epoch kovan left on it. Scenario as RC_recycle. Every safety invariant
\* but BirthFresh, which checks the epochs RetiredNode::new() stamps (a stale reuse stamps none).
\* It would catch kovan reading a stale header word (next, batch_link, refs_or_next) before
\* rewriting it, or a kept birth epoch that lets a batch skip the slot of a reader holding the
\* node. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "stale_reuse"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    FlushReleases
    LoopBounds
    NoLoss
