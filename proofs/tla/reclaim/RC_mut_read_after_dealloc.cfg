\* MUTATION read_after_dealloc: kovan's free_batch_list reads a node's batch_next after calling its
\* destructor instead of before. With recycling the destructor has already handed the node to the
\* pool, and another thread may have taken it. Scenario as RC_recycle. Shows the model catches
\* kovan touching a node after dealloc, which the comment in free_batch_list forbids. Expected:
\* NoUseAfterFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "read_after_dealloc"
    CountSteps = FALSE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
