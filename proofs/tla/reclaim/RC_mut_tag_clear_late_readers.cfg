\* MUTATION tag_clear_late on the reader that pins again during the flush: its pin clears the tag after the exchange, so an insert reads the old tag and takes its node back out of the active slot. Expected: PinnedIsActive broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 4
    Prog <- P_swap_readers_turn
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "tag_clear_late"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CHECK_DEADLOCK FALSE
CONSTRAINT EpochBound
INVARIANTS
    PinnedIsActive
