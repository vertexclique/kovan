\* A thread pins after its exit, through a handle of its own whose end is that handle's exit.
\* What it catches: thread 1 exits, then pins, loads cell 1, unpins (a thread-local destructor that
\* runs after its handle's) and exits again, the exit of the section's handle; thread 2 replaces
\* cell 1's value, retiring what thread 1 may hold, and flushes, at any moment. TLC checks the
\* invariants below on every interleaving, the step counts on: no value freed while a guard holds
\* it or freed twice, no value lost once all have exited (NoLoss), every loop and operation within
\* its bound.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_late_pin
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    Recycle = FALSE
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
    WaitFree
