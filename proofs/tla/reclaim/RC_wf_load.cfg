\* Step counts: loads against a writer that advances the epoch at every retire.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_wf_load
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    LoadAttempts = 3
    MaxEpoch = 8
    Mutation = "none"
    CountSteps = TRUE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    CountExact
    EraCoversBirth
    BirthBelowEpoch
    FlushEmpty
    LoopBounds
    WaitFree
    NoUseAfterFree
