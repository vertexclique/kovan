\* WITNESS: in RC_wf_recycle's exact setting, step counts included, a section holds a node in its
\* second or a later incarnation. Shows RC_wf_recycle really counts steps through reuse under a
\* reader. Expected: NoHeldReusedW broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_wf_recycle
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    CountSteps = TRUE
    Recycle = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoHeldReusedW
