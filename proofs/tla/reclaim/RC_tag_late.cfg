\* The leave's tag store, an insert, the pin's tag clear and exchange in every order: the pinned thread's slot stays active. Expected: pass.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 8
    Prog <- P_tag_late
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    WellFormed
    ActiveOnlyPinned
    NoBatchOnLeftSlot
    PinnedIsActive
    IdleHoldsNothing
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    CountExact
    EraCoversBirth
    FlushEmpty
    LoopBounds
    NoLoss
