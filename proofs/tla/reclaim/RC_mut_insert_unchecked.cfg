\* MUTATION insert_unchecked: an insert never reads the era word after its exchange, so a second flush's insert landing on the first's node in the reader's left slot keeps it there: the slot holds the two while the reader holds no guard. Expected: ActiveOnlyPinned violated.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 2
    MaxNodes = 8
    Prog <- P_leave_race2w
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    LoadAttempts = 2
    MaxEpoch = 10
    Mutation = "insert_unchecked"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    CountExact
    ActiveOnlyPinned
    LeftSlotsEmpty
