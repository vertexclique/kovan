\* MUTATION early_free: a traversal takes the next-to-last decrement of a batch's count for the last and frees the batch. Expected: ListsHoldNoFreed broken.
\* What it catches: a batch freed while a slot list still holds one of its nodes. In P_count_two
\* two threads are pinned while a batch is retired, so a batch goes into two slot lists and
\* its count starts at 2; freed one traversal early, a node stays in the other list after its
\* memory is gone. The other safety properties are checked beside it and hold until then.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 8
    Prog <- P_count_two
    Dtor <- Plain
    RetireFreq = 3
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    MaxEpoch = 10
    Mutation = "early_free"
    CountSteps = FALSE
    Recycle = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    ListsHoldNoFreed
    NoUseAfterFree
    NoDoubleFree
    WellFormed
    CacheBelowPublished
