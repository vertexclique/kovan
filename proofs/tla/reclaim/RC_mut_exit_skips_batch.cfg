\* MUTATION exit_skips_batch: the exit of a thread with no tid does nothing, so a value retired after the thread's exit is never submitted. Expected: NoLoss broken.
\* What it catches: the exit's claim of a tid taken out. Same scenario as RC_wf_unpinned_exit:
\* thread 1 retires, exits, retires once more after its exit (no tid: its first retire's claim
\* was released by that exit, and this retire is not at an advance) and exits again. In the
\* counterexample TLC finds, the second exit returns at once, both threads end, and the value is
\* still in thread 1's batch, neither freed nor parked: NoLoss broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_wf_unpinned_exit
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "exit_skips_batch"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoLoss
