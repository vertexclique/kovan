\* Weak fairness for every thread; a value retired after its thread's exit is eventually freed.
\* What it catches: a late value that nothing ever frees. Thread 1 exits, retires one value and
\* exits again; thread 2 waits until thread 1 has ended and flushes. TLC checks RetiredFreed on
\* every fair schedule: eventually no value is retired and unfreed.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 3
    Prog <- P_late_retire_live
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 6
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
