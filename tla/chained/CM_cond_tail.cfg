\* A compute of an absent key holding the chain end racing an insert of another key and a claim of the key.
SPECIFICATION Spec
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {1, 2, 3, 4}
    Prog <- P_cond_tail
    InitChain <- I_cond_tail
    InitCap = 1
    RzProg <- NoRz
    MaxNodes = 6
    MaxTables = 1
    MaxCap = 2
    Mutation = "none"
INVARIANTS
    NoError
    Exactness
    Linearizable
    NoUseAfterFree
    WalkExact
    CondExact
    AbsIsContent
    NoDuplicate
    RetiredUnreachable
    OldFrozen
    CountExact
    NoLeak
