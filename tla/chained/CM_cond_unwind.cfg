INVARIANTS
    NoError
    Exactness
    Linearizable
    NoUseAfterFree
    WalkExact
    CondExact
    AbsIsContent
    NoDuplicate
    RetiredUnreachable
    OldFrozen
    CountExact
    NoLeak
