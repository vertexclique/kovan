\* Two removes and a lookup behind them: every operation ends (weak fairness).
SPECIFICATION FairSpec
CONSTANTS
    Workers = {1, 2, 3}
    RZ = 9
    Keys = {1, 2, 3, 4}
    Prog <- P_live
    InitChain <- I_live
    InitCap = 1
    RzProg <- NoRz
