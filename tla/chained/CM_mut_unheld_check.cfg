    Workers = {1, 2}
    RZ = 9
    Keys = {1, 2}
    Prog <- P_cond_rem
    InitChain <- I_cond_rem
    InitCap = 1
    RzProg <- NoRz
    MaxNodes = 6
    MaxTables = 1
    MaxCap = 2
    Mutation = "unheld_check"
INVARIANTS
    CondExact
