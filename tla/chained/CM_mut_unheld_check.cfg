\* MUTATION unheld_check: a conditional write decides on the node it found without holding it, writes by a CAS, and after a lost CAS writes its decision to the node it finds next. Expected: CondExact broken (a remove_if removes a value its predicate never saw).
SPECIFICATION Spec
