\* A compute holding the middle node, a remove of the node before it and a lookup behind them: every operation ends (weak fairness).
SPECIFICATION FairSpec
CONSTANTS
    Workers = {1, 2, 3}
    RZ = 9
    Keys = {1, 2, 3}
    Prog <- P_live_cond
    InitChain <- I_live_cond
    InitCap = 1
    RzProg <- NoRz
    MaxNodes = 5
    MaxTables = 1
    MaxCap = 2
    Mutation = "none"
INVARIANTS
    NoError
    Exactness
    Linearizable
    NoUseAfterFree
    WalkExact
    CondExact
PROPERTIES
    Termination
