\* MUTATION stale_birth: a thread that advances the epoch keeps stamping its allocations with the epoch it cached before. Expected: BirthFresh broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 3
    Prog <- P_drain
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "stale_birth"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    BirthFresh
