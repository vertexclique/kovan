\* MUTATION slow_path_frees: a slow path frees the full cache at its traversals, the detached list's before the republication, running drops while its slot is closed to new batches: a batch a drop retires skips the slot. Expected: NoUseAfterFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 8
    Prog <- P_slow_dtor
    Dtor <- DtorRW2
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 1
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "slow_path_frees"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
