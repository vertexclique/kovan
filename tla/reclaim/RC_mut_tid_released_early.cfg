\* MUTATION tid_released_early: an exit releases its tid with its slots, before the drops it runs publish into the slot the next owner took. Expected: NoUseAfterFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 2
    NCells = 3
    MaxNodes = 11
    Prog <- P_exit_tid
    Dtor <- DtorR3
    RetireFreq = 3
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "tid_released_early"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
