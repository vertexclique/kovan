\* MUTATION no_escalate: a protected load retries until the epoch settles. Expected: WaitFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_wf_load
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 3
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 8
    Mutation = "no_escalate"
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    WaitFree
