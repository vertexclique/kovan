\* A retire on a batch and epoch boundary helps a slow path; the help's drain runs a drop that retires.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 6
    Prog <- P_help_dtor
    Dtor <- DtorRt1
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 1
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
