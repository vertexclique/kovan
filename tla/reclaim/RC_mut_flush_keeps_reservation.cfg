\* MUTATION flush_keeps_reservation: flush with no guard live ends only an escalated section, leaving the reservation at the epoch it published. Expected: FlushReleases broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 3
    Prog <- P_flush_esc
    Dtor <- DtorFE
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 1
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "flush_keeps_reservation"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    FlushReleases
