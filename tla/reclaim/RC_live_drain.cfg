\* One thread that keeps pinning after its retires advanced the epoch and a load raised its reservation: every retired node is eventually released.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 3
    Prog <- P_drain_live
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    DrainLive
