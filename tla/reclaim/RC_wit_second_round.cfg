\* WITNESS: an exit's second round submits what its first round's drops retired. Expected: NoSecondRoundW broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 5
    Prog <- P_exit_chain
    Dtor <- DtorChain
    RetireFreq = 1
    EpochFreq = 4
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoSecondRoundW
