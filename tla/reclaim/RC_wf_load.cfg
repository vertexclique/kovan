\* Step counts: loads against a writer that advances the epoch at every retire.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 4
    Prog <- P_wf_load
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 3
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 8
    Mutation = "none"
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    LoopBounds
    WaitFree
    NoUseAfterFree
