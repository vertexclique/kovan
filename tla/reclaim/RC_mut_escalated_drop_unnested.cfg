\* MUTATION escalated_drop_unnested: the escalated drop's transition runs with the pin count 0 and the cache copied out and written back, so a drop's own transition inside it loses what it traversed. Expected: NoLoss broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 8
    Prog <- P_esc_drop
    Dtor <- DtorRtRtPU
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 0
    LoadAttempts = 1
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "escalated_drop_unnested"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoLoss
