\* A retire outside any guard frees its batch at once; the drop it runs pins, transitions, loads and drops its guard.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 3
    Prog <- P_reentrant
    Dtor <- DtorR1At3
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
