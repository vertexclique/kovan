\* A drop run inside flush reads a cell another thread replaces and retires.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 2
    MaxNodes = 4
    Prog <- P_flush_dtor
    Dtor <- DtorR2
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
