\* MUTATION cache_copied: a full cache is freed from a copy while its cell still holds it, so a traversal re-entered from a drop frees it again. Expected: NoDoubleFree broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 9
    Prog <- P_reenter
    Dtor <- DtorRt1
    RetireFreq = 1
    EpochFreq = 1
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "cache_copied"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoDoubleFree
