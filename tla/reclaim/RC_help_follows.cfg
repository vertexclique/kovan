\* A pinner whose every transition takes the slow path, advancing the epoch between its pins, helped from its second request on by another thread's flush.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 6
    Prog <- P_help_follows
    Dtor <- Plain
    RetireFreq = 6
    EpochFreq = 1
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 1
    ExitRounds = 2
    MaxEpoch = 8
    Mutation = "none"
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
    WaitFree
