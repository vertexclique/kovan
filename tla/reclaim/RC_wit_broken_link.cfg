\* WITNESS: a traversal takes a node before its inserter links it, and the inserter traverses what it displaced. Expected: NoBrokenLinkW broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 5
    Prog <- P_two_loads
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 0
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoBrokenLinkW
