\* MUTATION detach_unclosed: a detach retries its compare-exchange of the list without closing the era first, so new retires keep failing it. Expected: DetachNotStarved broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 4
    Prog <- P_hand_over
    Dtor <- Plain
    RetireFreq = 1
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 1
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "detach_unclosed"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    DetachNotStarved
