\* MUTATION link_then_publish (the merged fix before this branch): an insert links its entry before it publishes the entry's hop bit (at the guard's release), so a lookup holding a word that still names the slot finds an insert a later lookup misses. Expected: Linearizable broken (lin_get).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_stale
    InitSlots <- S_disp
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 4
    MaxTables = 1
    MaxCap = 2
    MaxStamp = 3
    Mutation = "link_then_publish"
INVARIANTS
    Linearizable
