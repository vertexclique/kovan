\* Computes of a key being moved and a lookup: every operation ends (weak fairness).
SPECIFICATION FairSpec
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_cond_disp
    InitSlots <- S_disp
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 5
    MaxTables = 1
    MaxCap = 2
    MaxStamp = 3
    Mutation = "none"
INVARIANTS
    NoError
    Exactness
    Linearizable
    NoUseAfterFree
    WalkExact
    CondExact
PROPERTIES
    Termination
