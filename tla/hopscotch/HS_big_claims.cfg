\* Three workers and a grow: two claims of a key whose insert moves another, a force_remove of a third.
SPECIFICATION Spec
CONSTANTS
    Workers = {1, 2, 3}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_big_claims
    InitSlots <- S_disp
    InitCap = 2
    RzProg <- Grow
    NH = 2
    MaxEntries = 10
    MaxTables = 2
    MaxCap = 4
    MaxStamp = 3
    Mutation = "none"
INVARIANTS
    NoError
    Exactness
    Linearizable
    NoUseAfterFree
    WalkExact
    AbsIsContent
    NoDuplicate
    RetiredUnreachable
    OldHeld
    CountExact
    NoLeak
