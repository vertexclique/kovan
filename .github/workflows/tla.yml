name: TLA+

# Models are never hand-listed here: `tla.sh` hands a verified tla2tools.jar
# to `tla/run_tlc.sh all`, which checks every family under tla/ against its
# EXPECTED.txt, so a new model needs no change to this workflow.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  tla:
    name: TLA+ model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run TLA+ models
        run: .github/workflows/tla.sh
