name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+cmpxchg16b"

jobs:
  test:
    name: Test stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --release

      # Every `[[bench]]` target here sets `harness = false` (criterion owns
      # its own main), so `cargo test` never builds them and `clippy
      # --all-targets` only type-checks them without full codegen. Build them
      # for real so a bench-only compile error has a job that catches it.
      - name: Build benches
        run: cargo build --workspace --benches --release

  test-debug:
    name: Test debug (overflow checks, debug assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --workspace

      # Debug mode, deliberately: the release job above never turns on
      # overflow checks or debug_assert!, so a bound that only holds by
      # accident of release codegen has no other job that catches it.
      - name: Run tests (debug)
        run: cargo test --workspace

  test-nightly:
    name: Test nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Build (nightly)
        run: cargo build --workspace --features nightly

      - name: Run tests (nightly)
        run: cargo test --workspace --release --features nightly

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: "-C target-feature=+cmpxchg16b"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  shuttle:
    name: Shuttle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Scenario files are discovered, never hand-listed here: any
      # `tests/shuttle_*.rs` in any crate is picked up automatically (see
      # shuttle-test.sh), so a new model-checked scenario needs no change to
      # this workflow. Each crate opts in via its own `shuttle` feature, kept
      # off by default so it costs nothing outside this job. Release mode:
      # shuttle's own scheduling overhead dwarfs the workload either way, but
      # release keeps the per-iteration cost (and so the total run) down.
      - name: Run shuttle tests
        run: .github/workflows/shuttle-test.sh
