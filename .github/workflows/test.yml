name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+cmpxchg16b"

jobs:
  # Every supported toolchain on every platform: the workspace's rust-version (1.90), stable and
  # beta. Nightly has its job below, with and without the `nightly` feature.
  test:
    name: Test ${{ matrix.toolchain }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.90", stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --release

      # Every crate has a `recycle` feature, off by default, that takes node
      # memory from kovan's magazine cache: the suite runs with it too.
      - name: Run tests (recycle)
        run: cargo test --workspace --release --features recycle

      # `cargo test` never builds bench targets (they default to `test =
      # false`) and `clippy --all-targets` only checks them, with no codegen
      # and no link. Build them for real so a bench that fails only there has
      # a job that catches it.
      - name: Build benches
        if: matrix.toolchain == 'stable'
        run: cargo build --workspace --benches --release

  test-debug:
    name: Test debug (overflow checks, debug assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --workspace

      # Debug mode, deliberately: the release job above never turns on
      # overflow checks or debug_assert!, so a bound that only holds by
      # accident of release codegen has no other job that catches it.
      - name: Run tests (debug)
        run: cargo test --workspace

      - name: Run tests (debug, recycle)
        run: cargo test --workspace --features recycle

  test-nightly:
    name: Test nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Build (nightly)
        run: cargo build --workspace --features nightly

      - name: Run tests (nightly)
        run: cargo test --workspace --release --features nightly

      # The nightly toolchain with the default handle, not only the `nightly` one.
      - name: Run tests (nightly toolchain, default features)
        run: cargo test --workspace --release

  # AddressSanitizer over the whole suite: a read of memory already freed or a value never freed
  # fails the job with the access and the stacks, also where a test's own checks would pass. The
  # thread-exit tests read the value they hold after another thread retired it, so a missing
  # reservation is reported here every time. `--target` keeps build scripts and proc macros
  # uninstrumented.
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C target-feature=+cmpxchg16b -Zsanitizer=address"
      RUSTDOCFLAGS: "-Zsanitizer=address"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Run tests (AddressSanitizer)
        run: cargo test --workspace --lib --tests --target x86_64-unknown-linux-gnu

      - name: Run tests (AddressSanitizer, recycle)
        run: cargo test --workspace --lib --tests --features recycle --target x86_64-unknown-linux-gnu

      - name: Run tests (AddressSanitizer, nightly handle)
        run: cargo test --workspace --lib --tests --features nightly --target x86_64-unknown-linux-gnu

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: "-C target-feature=+cmpxchg16b"

      - name: Clippy (recycle)
        run: cargo clippy --workspace --all-targets --features recycle -- -D warnings
        env:
          RUSTFLAGS: "-C target-feature=+cmpxchg16b"

      # `default = ["std"]` on kovan and kovan-map is a real feature
      # combination (the no_std + alloc path); wasm.yml proves it builds at
      # 32 bits, this proves it on the host target too. `--lib` for the same
      # reason as the wasm job: `--all-targets` would pull in the native-only
      # dev-deps of tests/benches, which do not build without `std`.
      - name: Clippy (no_std, no default features)
        run: |
          cargo clippy -p kovan --no-default-features --lib -- -D warnings
          cargo clippy -p kovan-map --no-default-features --lib -- -D warnings
        env:
          RUSTFLAGS: "-C target-feature=+cmpxchg16b"

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A broken intra-doc link or a warning fails the build, with and
      # without the `recycle` feature (which adds the magazine cache's docs).
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Docs (recycle)
        run: cargo doc --workspace --no-deps --features recycle
        env:
          RUSTDOCFLAGS: "-D warnings"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  shuttle:
    name: Shuttle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Scenario files are discovered, never hand-listed here: any
      # `tests/shuttle_*.rs` in any crate is picked up automatically (see
      # shuttle-test.sh), so a new model-checked scenario needs no change to
      # this workflow. Each crate opts in via its own `shuttle` feature, kept
      # off by default so it costs nothing outside this job. Release mode:
      # shuttle's own scheduling overhead dwarfs the workload either way, but
      # release keeps the per-iteration cost (and so the total run) down.
      - name: Run shuttle tests
        run: .github/workflows/shuttle-test.sh

      # The same scenarios with every node's memory from the magazine cache,
      # and the cache's own (`shuttle_magazine`, which needs the feature).
      - name: Run shuttle tests (recycle)
        run: .github/workflows/shuttle-test.sh
        env:
          SHUTTLE_FEATURES: recycle
