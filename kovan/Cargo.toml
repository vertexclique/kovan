[package]
name = "kovan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance wait-free memory reclamation for wait-free data structures. Bounded memory usage, predictable latency."
keywords = ["concurrency", "lock-free", "memory-reclamation", "smr"]
categories = ["concurrency", "memory-management", "no-std"]
readme.workspace = true

exclude = ["model_chk"]

[package.metadata.docs.rs]
rustdoc-args = ["-C", "target-feature=+cmpxchg16b"]

[lib]
name = "kovan"
path = "src/lib.rs"

[features]
default = ["std"]
std = []          # Enable std-dependent features.
nightly = []      # Enable nightly-only optimizations.
# Swaps the pointer-word atomic backing `Atomic<T>` and the reclamation
# guard's protect-load path for shuttle's instrumented equivalent, so
# shuttle's scheduler gets a yield point at every pointer load/store/CAS.
# Dev/test only (`shuttle` is an optional dependency): zero cost unless a
# crate explicitly opts in for its shuttle test binary.
shuttle = ["dep:shuttle"]

[dependencies]
once_cell = { version = "1.21", default-features = false, features = ["alloc"] }
portable-atomic = { version = "1.11.1", default-features = false, features = [
    "require-cas",
    "fallback",
] }
shuttle = { version = "0.9.1", optional = true }

# criterion and shuttle are native-only: both pull in threading and stack
# machinery (shuttle -> corosensei) that has no wasm32 implementation, so
# leaving them unconditional breaks `cargo check --all-targets` for the wasm
# targets even though the library itself builds fine. The tests and benches
# that use them carry a matching `#![cfg(not(target_arch = "wasm32"))]`.
# Real test execution on wasm32-unknown-unknown (the browser target) needs the
# wasm-bindgen harness: `cargo test --target wasm32-unknown-unknown` has no
# native test runner. wasip1 is NOT a substitute -- std routes `target_os =
# "wasi"` to the unix impl, so Instant::now()/thread::sleep work there and
# panic on unknown-unknown. Only this target catches that class.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
shuttle = "0.9.1"
# Other memory-reclamation crates, used only by the comparison benchmark
# (`benches/comparison.rs`). Commented out together with that benchmark's
# "other"-library code; uncomment both to re-enable the cross-library comparison.
# crossbeam-epoch = "0.9.18"
# seize = "0.5.1"
# haphazard = "0.1.8"

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "throughput"
harness = false

# Single-threaded adaptations of the tests/*.rs integration tests, kept
# under tests/wasm/ so they also run on 32-bit wasm (wasm32-wasip1 has no
# working std::thread::spawn). Cargo's autodiscovery only picks up
# top-level tests/*.rs files, not subdirectories, so each target below is
# registered explicitly. The tests/*.rs originals are untouched and remain
# the real concurrency coverage on native.
[[test]]
name = "wasm_atom"
path = "tests/wasm/atom.rs"

[[test]]
name = "wasm_cache_padded"
path = "tests/wasm/cache_padded.rs"

[[test]]
name = "wasm_correctness"
path = "tests/wasm/correctness.rs"

[[test]]
name = "wasm_protect"
path = "tests/wasm/protect.rs"

[[test]]
name = "wasm_reclaim"
path = "tests/wasm/reclaim.rs"

[[test]]
name = "wasm_reclaim_fixes"
path = "tests/wasm/reclaim_fixes.rs"

[[test]]
name = "wasm_robust"
path = "tests/wasm/robust.rs"

[[test]]
name = "wasm_stress"
path = "tests/wasm/stress.rs"
