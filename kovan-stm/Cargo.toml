[package]
name = "kovan-stm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Software Transactional Memory (STM) implementation using Kovan for memory reclamation"
keywords = ["concurrency", "stm", "transaction", "atomic"]
categories = ["concurrency", "data-structures"]
readme.workspace = true

[lib]
name = "kovan_stm"
path = "src/lib.rs"

[features]
# See `kovan`'s `shuttle` feature doc. Cascades so `TVarInner::data`
# (`kovan::Atomic<StmNode<T>>`) is shuttle-instrumented; also swaps this
# crate's own `version_lock`/`lock_atomic` (see `var.rs`, `transaction.rs`),
# the commit-time lock CAS these tests target.
shuttle = ["kovan/shuttle", "kovan-map/shuttle", "dep:shuttle"]

[dependencies]
kovan = { workspace = true }
kovan-map = { workspace = true }
shuttle = { version = "0.9.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shuttle = "0.9.1"

# Single-threaded adaptations of the tests/*.rs integration tests, kept
# under tests/wasm/ so they also run on 32-bit wasm (wasm32-wasip1 has no
# working std::thread::spawn). Cargo's autodiscovery only picks up
# top-level tests/*.rs files, not subdirectories, so each target below is
# registered explicitly. The tests/*.rs originals are untouched and remain
# the real concurrency coverage on native.
[[test]]
name = "wasm_integration"
path = "tests/wasm/integration.rs"

[[test]]
name = "wasm_stress"
path = "tests/wasm/stress.rs"
